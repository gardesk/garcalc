[package]
name = "garcalc"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "TI-Nspire-like calculator for gardesk"

[[bin]]
name = "garcalc"
path = "src/main.rs"

[dependencies]
# Internal crates
garcalc-cas = { workspace = true }
garcalc-ipc = { workspace = true }
garcalc-graph = { workspace = true }

# UI toolkit
gartk-core = { workspace = true }
gartk-x11 = { workspace = true }
gartk-render = { workspace = true }

# X11
x11rb = { workspace = true }

# Cairo
cairo-rs = { workspace = true }

# CLI
clap = { workspace = true }

# Error handling
anyhow = { workspace = true }
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Configuration
toml = { workspace = true }
dirs = { workspace = true }

# Async (for IPC server)
tokio = { workspace = true }
